kind = "web"
previewPath = "/"
title = "AushadhiChakra"
description = "A production-ready healthcare supply resilience command center for Udupi district, with FEFO inventory rebalancing, contagion simulation, dispatch manifests, offline SMS intake, and a public medicine availability portal."
version = "1.0.0"
id = "artifacts/aushadhi-chakra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18937

[services.development]
run = "pnpm --filter @workspace/aushadhi-chakra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aushadhi-chakra", "run", "build" ]
serve = "static"
publicDir = "artifacts/aushadhi-chakra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18937"
BASE_PATH = "/"
